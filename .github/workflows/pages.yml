# Publie site/ sur GitHub Pages, avec les polices de dist/ et de
# sources/luciole/ copiées au moment de la publication.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "dist/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copier les polices dans le site
        run: |
          mkdir -p site/fonts
          cp dist/*.ttf sources/luciole/Luciole_Regular.ttf sources/luciole/Luciole_Bold.ttf site/fonts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
